  <ellipse class="neb" cx="420" cy="58.8" rx="252" ry="110" fill="url(#np)"/>
  <circle class="s2" cx="702.39" cy="8.94" r="0.35" fill="#fde68a"/><circle class="s2" cx="416.24" cy="29.44" r="0.47" fill="#a5f3fc"/><circle class="s3" cx="232.04" cy="0.68" r="1.52" fill="#fde68a"/><circle class="s1" cx="7.55" cy="23.29" r="0.75" fill="#ffffff"/><circle cx="418.12" cy="18.22" r="1.42" fill="#dbe4ff" opacity="0.7"/><circle cx="346.9" cy="55.53" r="0.52" fill="#a5f3fc" opacity="0.34"/><circle class="s3" cx="368.59" cy="18.37" r="0.46" fill="#dbe4ff"/><circle class="s2" cx="323.83" cy="31.93" r="0.47" fill="#dbe4ff"/><circle class="s1" cx="244.13" cy="39.45" r="1.27" fill="#ddd6fe"/><circle cx="397.72" cy="42.06" r="0.54" fill="#fde68a" opacity="0.54"/><circle cx="660.8" cy="19.13" r="0.35" fill="#fde68a" opacity="0.34"/><circle cx="158.48" cy="47.79" r="0.43" fill="#dbe4ff" opacity="0.68"/><circle cx="824.6" cy="11.22" r="1.15" fill="#a5f3fc" opacity="0.54"/><circle class="s2" cx="616.91" cy="49.08" r="0.36" fill="#ddd6fe"/><circle class="s1" cx="428.51" cy="8.35" r="0.36" fill="#a5f3fc"/><circle cx="63.63" cy="10.66" r="1.28" fill="#dbe4ff" opacity="0.55"/><circle cx="722.42" cy="43.88" r="0.38" fill="#fde68a" opacity="0.29"/><circle class="s3" cx="542.66" cy="52.74" r="0.35" fill="#a5f3fc"/><circle class="s1" cx="442.07" cy="4.01" r="0.89" fill="#dbe4ff"/><circle cx="670.98" cy="8.19" r="0.36" fill="#ffffff" opacity="0.4"/><circle class="s3" cx="97.79" cy="16" r="0.54" fill="#fde68a"/><circle class="s2" cx="707.55" cy="16.51" r="0.47" fill="#a5f3fc"/>
  
  <text x="32" y="35" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#22d3ee" letter-spacing="1.5">03</text>
  <text x="64" y="35" font-size="16" font-weight="700" fill="#eceeff" letter-spacing="2.2">FEATURED PROJECTS</text>
