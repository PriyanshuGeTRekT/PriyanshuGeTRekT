<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="56" viewBox="0 0 840 56" role="img" aria-label="FEATURED PROJECTS" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>FEATURED PROJECTS</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060817"/><stop offset="1" stop-color="#0b0e25"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".45" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/></linearGradient>
  <linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="nv"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.17"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="nc"><stop offset="0" stop-color="#0891b2" stop-opacity="0.15"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <radialGradient id="np"><stop offset="0" stop-color="#db2777" stop-opacity="0.1"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="840" height="56" rx="18"/></clipPath>
  
</defs>
<style>
.s1{animation:tw 3.4s ease-in-out infinite}
.s2{animation:tw 4.9s ease-in-out -1.7s infinite}
.s3{animation:tw 6.3s ease-in-out -3.1s infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.neb{animation:drift 26s ease-in-out infinite alternate}
.neb2{animation:drift 34s ease-in-out -9s infinite alternate-reverse}
@keyframes drift{from{transform:translate(-18px,-8px)}to{transform:translate(22px,12px)}}
.scan{animation:scan 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--scan,706px));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
