<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="410" height="190" viewBox="0 0 410 190" role="img" aria-label="Brightness Tray: A ~340 KB Windows tray app that sets the brightness of every display: laptop panels, DDC/CI monitors and a software fallback. 0% idle CPU." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>Brightness Tray: A ~340 KB Windows tray app that sets the brightness of every display: laptop panels, DDC/CI monitors and a software fallback. 0% idle CPU.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060817"/><stop offset="1" stop-color="#0b0e25"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".45" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/></linearGradient>
  <linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="nv"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.19"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="nc"><stop offset="0" stop-color="#0891b2" stop-opacity="0.17"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <radialGradient id="np"><stop offset="0" stop-color="#db2777" stop-opacity="0.11"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="410" height="190" rx="18"/></clipPath>
  
  <linearGradient id="cm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  <radialGradient id="corner"><stop offset="0" stop-color="#fbbf24" stop-opacity=".26"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
</defs>
<style>
.s1{animation:tw 3.4s ease-in-out infinite}
.s2{animation:tw 4.9s ease-in-out -1.7s infinite}
.s3{animation:tw 6.3s ease-in-out -3.1s infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.neb{animation:drift 26s ease-in-out infinite alternate}
.neb2{animation:drift 34s ease-in-out -9s infinite alternate-reverse}
@keyframes drift{from{transform:translate(-18px,-8px)}to{transform:translate(22px,12px)}}
.scan{animation:scan 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--scan,276px));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.comet{animation:comet 5.5s cubic-bezier(.45,0,.55,1) infinite}
@keyframes comet{0%{transform:translateX(-90px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(410px);opacity:0}}
.go{animation:go 2.6s ease-in-out infinite}
@keyframes go{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="410" height="190" fill="url(#bg)"/>
  <ellipse class="neb" cx="336.2" cy="19" rx="147.6" ry="150" fill="url(#nv)"/>
  <ellipse class="neb2" cx="32.8" cy="180.5" rx="139.4" ry="140" fill="url(#nc)"/>
  <ellipse class="neb" cx="205" cy="199.5" rx="123" ry="110" fill="url(#np)"/>
  <circle cx="16.09" cy="182.24" r="1.04" fill="#dbe4ff" opacity="0.25"/><circle cx="117.53" cy="110.27" r="0.35" fill="#dbe4ff" opacity="0.58"/><circle class="s1" cx="31.07" cy="123" r="1.48" fill="#ffffff"/><circle cx="391.04" cy="37.67" r="0.48" fill="#dbe4ff" opacity="0.46"/><circle class="s2" cx="141.25" cy="125.06" r="0.51" fill="#ffffff"/><circle class="s2" cx="90.53" cy="106.45" r="1.14" fill="#fde68a"/><circle cx="9.12" cy="22.29" r="0.6" fill="#dbe4ff" opacity="0.25"/><circle class="s3" cx="202.41" cy="142.5" r="1.2" fill="#fde68a"/><circle class="s3" cx="2.91" cy="62.16" r="1.18" fill="#ffffff"/><circle cx="368.04" cy="164.44" r="0.39" fill="#dbe4ff" opacity="0.45"/><circle class="s2" cx="145.29" cy="159.62" r="0.75" fill="#dbe4ff"/><circle class="s1" cx="293.57" cy="45.35" r="0.87" fill="#a5f3fc"/><circle cx="205.11" cy="127.01" r="1.56" fill="#ddd6fe" opacity="0.31"/><circle class="s1" cx="72.08" cy="178.5" r="0.4" fill="#ddd6fe"/><circle cx="199.39" cy="142.69" r="1.19" fill="#dbe4ff" opacity="0.27"/><circle cx="39.26" cy="125.7" r="0.36" fill="#fde68a" opacity="0.47"/>
  
  <circle cx="390" cy="14" r="130" fill="url(#corner)"/>
  <rect class="comet" x="0" y="0" width="90" height="2.5" fill="url(#cm)"/>
  <circle cx="29" cy="30.5" r="4.5" fill="#dea584"/><text x="40" y="34.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9aa3cc">Rust</text>
  <path transform="translate(359.6 23.5) scale(0.5833)" d="M12 2.6l2.75 5.9 6.45.8-4.75 4.45 1.25 6.4L12 17l-5.7 3.15 1.25-6.4L2.8 9.3l6.45-.8z" fill="#fbbf24"/><text x="386" y="35" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#fbbf24">8</text>
  <text x="24" y="70" font-size="18.5" font-weight="700" fill="#eceeff">Brightness Tray</text>
  <text x="24" y="94" font-size="12.5" fill="#9aa3cc">A ~340 KB Windows tray app that sets the brightness of</text><text x="24" y="112" font-size="12.5" fill="#9aa3cc">every display: laptop panels, DDC/CI monitors and a</text><text x="24" y="130" font-size="12.5" fill="#9aa3cc">software fallback. 0% idle CPU.</text>
  <rect x="24" y="144" width="44.4" height="22" rx="11" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".38"/><text x="46.2" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">Rust</text><rect x="75.4" y="144" width="51" height="22" rx="11" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".38"/><text x="100.9" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">Win32</text><rect x="133.4" y="144" width="57.6" height="22" rx="11" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".38"/><text x="162.2" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">DDC/CI</text>
  <g class="go"><path d="M372 162l9-9m-7 0h7v7" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x=".75" y=".75" width="408.5" height="188.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
