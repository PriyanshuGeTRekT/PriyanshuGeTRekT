  <circle cx="390" cy="14" r="130" fill="url(#corner)"/>
  <rect class="comet" x="0" y="0" width="90" height="2.5" fill="url(#cm)"/>
  <circle cx="29" cy="30.5" r="4.5" fill="#73a3d8"/><text x="40" y="34.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9aa3cc">TypeScript</text>
  
  <text x="24" y="70" font-size="18.5" font-weight="700" fill="#eceeff">namanpuja.com</text>
  <text x="24" y="94" font-size="12.5" fill="#9aa3cc">Production booking platform for Vedic pujas: a Next.js</text><text x="24" y="112" font-size="12.5" fill="#9aa3cc">storefront, an Express + TypeScript API, an admin</text><text x="24" y="130" font-size="12.5" fill="#9aa3cc">console and a CRM that syncs every booking.</text>
  <rect x="24" y="144" width="64.2" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".38"/><text x="56.1" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">Next.js</text><rect x="95.2" y="144" width="64.2" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".38"/><text x="127.3" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">Express</text><rect x="166.4" y="144" width="90.6" height="22" rx="11" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".38"/><text x="211.7" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">react-admin</text>
  <g class="go"><path d="M372 162l9-9m-7 0h7v7" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x=".75" y=".75" width="408.5" height="188.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
