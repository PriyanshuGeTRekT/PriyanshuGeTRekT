<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="410" height="190" viewBox="0 0 410 190" role="img" aria-label="RFP Intelligence: Hybrid search and multi-agent extraction over public bid documents. Every field is cited to a file, page and quote, backed by evals and agent traces." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>RFP Intelligence: Hybrid search and multi-agent extraction over public bid documents. Every field is cited to a file, page and quote, backed by evals and agent traces.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060817"/><stop offset="1" stop-color="#0b0e25"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".45" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/></linearGradient>
  <linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="nv"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.19"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="nc"><stop offset="0" stop-color="#0891b2" stop-opacity="0.17"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <radialGradient id="np"><stop offset="0" stop-color="#db2777" stop-opacity="0.11"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="410" height="190" rx="18"/></clipPath>
  
  <linearGradient id="cm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="corner"><stop offset="0" stop-color="#a78bfa" stop-opacity=".26"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<style>
.s1{animation:tw 3.4s ease-in-out infinite}
.s2{animation:tw 4.9s ease-in-out -1.7s infinite}
.s3{animation:tw 6.3s ease-in-out -3.1s infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.neb{animation:drift 26s ease-in-out infinite alternate}
.neb2{animation:drift 34s ease-in-out -9s infinite alternate-reverse}
@keyframes drift{from{transform:translate(-18px,-8px)}to{transform:translate(22px,12px)}}
.scan{animation:scan 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(var(--scan,276px));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.comet{animation:comet 5.5s cubic-bezier(.45,0,.55,1) infinite}
@keyframes comet{0%{transform:translateX(-90px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(410px);opacity:0}}
.go{animation:go 2.6s ease-in-out infinite}
@keyframes go{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="410" height="190" fill="url(#bg)"/>
  <ellipse class="neb" cx="336.2" cy="19" rx="147.6" ry="150" fill="url(#nv)"/>
  <ellipse class="neb2" cx="32.8" cy="180.5" rx="139.4" ry="140" fill="url(#nc)"/>
  <ellipse class="neb" cx="205" cy="199.5" rx="123" ry="110" fill="url(#np)"/>
  <circle class="s1" cx="181.68" cy="94.98" r="1.05" fill="#fde68a"/><circle cx="206.18" cy="154.23" r="1.48" fill="#a5f3fc" opacity="0.47"/><circle class="s1" cx="395.06" cy="100.5" r="0.68" fill="#dbe4ff"/><circle cx="149.99" cy="166.99" r="0.44" fill="#dbe4ff" opacity="0.67"/><circle cx="311.14" cy="187.55" r="1.54" fill="#ffffff" opacity="0.52"/><circle cx="395.76" cy="155.09" r="0.36" fill="#dbe4ff" opacity="0.55"/><circle cx="209.42" cy="24.74" r="0.99" fill="#dbe4ff" opacity="0.54"/><circle class="s1" cx="91.4" cy="80.05" r="0.35" fill="#dbe4ff"/><circle class="s3" cx="361.49" cy="12.93" r="0.38" fill="#fde68a"/><circle class="s3" cx="212.5" cy="145.67" r="0.35" fill="#fde68a"/><circle cx="7.94" cy="58.03" r="0.35" fill="#ffffff" opacity="0.31"/><circle cx="304.37" cy="102.46" r="1.49" fill="#a5f3fc" opacity="0.32"/><circle class="s1" cx="286.59" cy="74.12" r="0.6" fill="#dbe4ff"/><circle class="s1" cx="133.87" cy="150.8" r="0.46" fill="#ffffff"/><circle cx="67.18" cy="106.22" r="0.42" fill="#dbe4ff" opacity="0.36"/><circle cx="306.86" cy="61.94" r="0.5" fill="#dbe4ff" opacity="0.61"/>
  
  <circle cx="390" cy="14" r="130" fill="url(#corner)"/>
  <rect class="comet" x="0" y="0" width="90" height="2.5" fill="url(#cm)"/>
  <circle cx="29" cy="30.5" r="4.5" fill="#769fc2"/><text x="40" y="34.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#9aa3cc">Python</text>
  
  <text x="24" y="70" font-size="18.5" font-weight="700" fill="#eceeff">RFP Intelligence</text>
  <text x="24" y="94" font-size="12.5" fill="#9aa3cc">Hybrid search and multi-agent extraction over public</text><text x="24" y="112" font-size="12.5" fill="#9aa3cc">bid documents. Every field is cited to a file, page and</text><text x="24" y="130" font-size="12.5" fill="#9aa3cc">quote, backed by evals and agent traces.</text>
  <rect x="24" y="144" width="77.4" height="22" rx="11" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".38"/><text x="62.7" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">LangGraph</text><rect x="108.4" y="144" width="57.6" height="22" rx="11" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".38"/><text x="137.2" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">Qdrant</text><rect x="173" y="144" width="103.8" height="22" rx="11" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".38"/><text x="224.9" y="159" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#eceeff" opacity=".9">OpenTelemetry</text>
  <g class="go"><path d="M372 162l9-9m-7 0h7v7" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x=".75" y=".75" width="408.5" height="188.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
